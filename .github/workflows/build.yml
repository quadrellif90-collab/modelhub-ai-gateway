name: Build (cross-platform)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: --win nsis
            artifact: "ModelHub-win"
          - os: macos-latest
            dist: --mac dmg
            artifact: "ModelHub-mac"
          - os: ubuntu-latest
            dist: --linux AppImage deb
            artifact: "ModelHub-linux"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run dist -- ${{ matrix.dist }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn
